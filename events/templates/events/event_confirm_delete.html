{% extends 'events/base.html' %}

{% block content %}
<section class="dashboard-section form-card">
    <span class="section-label">DELETE EVENT</span>
    <h2>Delete {{ event.title }}?</h2>
    <p>This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="main-btn danger-btn">Confirm Delete</button>
        <a href="{% url 'event_list' %}" class="text-btn">Cancel</a>
    </form>
</section>
{% endblock %}
